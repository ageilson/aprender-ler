<!doctype html>
<html lang="pt-BR" data-escrita="maiuscula">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aprender a Ler</title>
  <meta name="description" content="Alfabetização brincando, inspirada no Método Paulo Freire: passe o dedo e ouça letras, sílabas e palavras.">
  <meta name="theme-color" content="#ff8a3d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="preload" href="fontes/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fontes/playwrite-br-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="topo" hidden>
    <button class="topo-btn" id="btn-inicio" aria-label="Lições">🏠</button>
    <h1 id="topo-titulo">Aprender a Ler</h1>
    <div id="escritas" role="group" aria-label="Tipo de letra">
      <button data-modo="maiuscula" title="Letra de forma maiúscula"><span class="esc-forma">AA</span></button>
      <button data-modo="minuscula" title="Letra de forma minúscula"><span class="esc-forma">aa</span></button>
      <button data-modo="cursiva" title="Letra cursiva"><span class="esc-cursiva">aa</span></button>
      <button data-modo="misturada" title="Misturar todas">🔀</button>
    </div>
    <button class="topo-btn" id="btn-perfil" aria-label="Trocar criança"><span id="perfil-bicho">🙂</span><span id="perfil-estrelas">0⭐</span></button>
    <button class="topo-btn" id="btn-pais" aria-label="Área dos pais">⚙️</button>
  </header>
  <main id="tela"></main>
  <div id="festa" aria-hidden="true"></div>
  <noscript>Este app precisa de JavaScript ligado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
